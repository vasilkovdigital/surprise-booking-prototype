<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surprise.by — запуск прототипа…</title>
<link rel="icon" href="/surprise-booking-prototype/brand/mark-confetti.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; text-align: center; padding: 24px; }
  img { height: 34px; margin-bottom: 24px; }
  .bar { width: 160px; height: 4px; border-radius: 4px; background: #eee; margin: 20px auto 0; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #9BE1FF; border-radius: 4px; animation: m 1.1s ease-in-out infinite; }
  @keyframes m { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  small { color: #6f6f6f; display: block; max-width: 36ch; margin: 8px auto 0; font-size: 14px; }
</style></head><body>
<div><img src="/surprise-booking-prototype/brand/logo.svg" alt="Surprise.by">
<div id="msg">Запускаем прототип…</div>
<div class="bar"><i></i></div>
<small>Первый запуск займёт несколько секунд: база данных создаётся прямо в вашем браузере.</small></div>
<script>
(async () => {
  const BASE = '/surprise-booking-prototype';
  const msg = document.getElementById('msg');
  const fail = (t) => { msg.textContent = t; document.querySelector('.bar').remove(); };
  if (!('serviceWorker' in navigator)) return fail('Нужен современный браузер (Chrome, Safari, Firefox, Edge).');
  const tries = Number(sessionStorage.getItem('boot-tries') || 0);
  if (tries > 3) { sessionStorage.removeItem('boot-tries'); return fail('Не получилось запустить прототип. Обновите страницу или откройте её в другом браузере.'); }
  sessionStorage.setItem('boot-tries', tries + 1);
  try {
    await navigator.serviceWorker.register(BASE + '/sw.js', { scope: BASE + '/' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise((r) => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }); setTimeout(r, 4000); });
    }
    await fetch(BASE + '/catalog.json'); // прогрев: создаем базу до открытия страницы
    sessionStorage.removeItem('boot-tries');
    location.replace(location.href);
  } catch (e) { fail('Ошибка запуска: ' + e.message); }
})();
</script></body></html>
